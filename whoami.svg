<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- Terminal background -->
  <rect width="680" height="320" rx="10" ry="10" fill="#161b22"/>

  <!-- Title bar -->
  <rect width="680" height="36" rx="10" ry="10" fill="#21262d"/>
  <rect y="20" width="680" height="16" fill="#21262d"/>

  <!-- Dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="340" y="23" fill="#8b949e" font-size="12" text-anchor="middle" dominant-baseline="middle">bash — profile</text>

  <!-- Prompt line -->
  <text x="20" y="68" fill="#7ee787" font-size="13">➜</text>
  <text x="34" y="68" fill="#8b949e" font-size="13"> ~ </text>
  <text x="55" y="68" fill="#e94560" font-size="13" font-weight="bold">whoami</text>

  <!-- Row 1: name -->
  <text x="30" y="96" fill="#7ee787" font-size="13">name</text>
  <text x="140" y="96" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="96" fill="#a5d6ff" font-size="13">Nguyễn Bình An</text>

  <!-- Row 2: alias -->
  <text x="30" y="116" fill="#7ee787" font-size="13">alias</text>
  <text x="140" y="116" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="116" fill="#c9d1d9" font-size="13">BinhAn1676</text>

  <!-- Row 3: role -->
  <text x="30" y="136" fill="#7ee787" font-size="13">role</text>
  <text x="140" y="136" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="136" fill="#c9d1d9" font-size="13">Java Backend Developer</text>

  <!-- Row 4: location -->
  <text x="30" y="156" fill="#7ee787" font-size="13">location</text>
  <text x="140" y="156" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="156" fill="#c9d1d9" font-size="13">Hà Nội, Vietnam 🇻🇳</text>

  <!-- Row 5: experience -->
  <text x="30" y="176" fill="#7ee787" font-size="13">experience</text>
  <text x="140" y="176" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="176" fill="#c9d1d9" font-size="13">~2.5 years in fintech / banking</text>

  <!-- Row 6: education -->
  <text x="30" y="196" fill="#7ee787" font-size="13">education</text>
  <text x="140" y="196" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="196" fill="#c9d1d9" font-size="13">KMA | TOEIC: 955</text>

  <!-- Row 7: interests -->
  <text x="30" y="216" fill="#7ee787" font-size="13">interests</text>
  <text x="140" y="216" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="216" fill="#d2a8ff" font-size="13">[ Developer Tooling, AI, Networking ]</text>

  <!-- Row 8: learning -->
  <text x="30" y="236" fill="#7ee787" font-size="13">learning</text>
  <text x="140" y="236" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="236" fill="#d2a8ff" font-size="13">[ System Design, Cloud-platform, Japanese ]</text>

  <!-- Row 9: goal -->
  <text x="30" y="256" fill="#7ee787" font-size="13">goal</text>
  <text x="140" y="256" fill="#8b949e" font-size="13">:</text>
  <text x="155" y="256" fill="#a5d6ff" font-size="13">"Chilling"</text>

  <!-- Closing prompt + cursor -->
  <text x="20" y="286" fill="#7ee787" font-size="13">➜</text>
  <text x="34" y="286" fill="#8b949e" font-size="13"> ~</text>
  <rect x="56" y="274" width="8" height="14" fill="#e94560">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
